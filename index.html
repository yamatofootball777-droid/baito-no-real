function paymentKind(r){return ['hourly','lesson','daily'].includes(r.pay_type)?r.pay_type:'hourly'}
function unitHours(r){return paymentKind(r)==='hourly'?num(r.paid_hours)+num(r.unpaid_minutes)/60:num(r.unit_total_hours)}
function unitPay(r){return paymentKind(r)==='hourly'?num(r.hourly_wage)*num(r.paid_hours):num(r.unit_pay)}
function equivalentHourly(r){const h=unitHours(r);return h>0?unitPay(r)/h:0}

function actualWage(r){const h=unitHours(r);return h>0?Math.round((unitPay(r)-num(r.commute_cost))/h):0}

const num = (v,def=0)=>Number.isFinite(Number(v)) && v!==null && v!=='' ? Number(v) : def;
function monthlyBase(r,days){return unitPay(r)*days*52/12}

function burdenRate(r){if(!r.rules_strictness)return null;const busy=(num(r.busyness,3)-1)/4,rel=(5-num(r.relationships,3))/4,rules=(num(r.rules_strictness,3)-1)/4;return Math.min(.20,Math.max(0,.20*(.4*busy+.4*rel+.2*rules)))}
function environmentFactor(r,category){const burden=burdenRate(r),skill=skillValue(r),benchmark=num(BENCHMARKS[category],0);if(burden===null||skill===null)return null;const relief=benchmark>0?Math.max(0,Math.min(.5,(equivalentHourly(r)-benchmark)/benchmark)):0;const bonus=MAX_SKILL_BONUS*(skill-1)/4;return {k:1-burden*(1-relief)+bonus,burden,relief,bonus,benchmark}}
function mealEconomicValue(r){return Math.max(0,num(r.meal_value,0)-num(r.meal_cost,0))}
function reviewMonthly(r,days,category,kind){if(!eligible(r,days))return null;const base=monthlyBase(r,days);if(kind==='monthly')return Math.round(base);const factor=environmentFactor(r,category);if(!factor)return null;const meal=mealEconomicValue(r)*days*52/12;const fares=num(r.commute_cost,0)*days*52/12;return Math.round((base+meal-fares)*factor.k)}

async function reloadRemote(){
  const s=state.supabase;
  const [stores,reviews,genderSummary,pending,req,adminRes]=await Promise.all([
    s.from('stores').select('*').eq('is_active',true).order('created_at',{ascending:false}),
    s.from('public_reviews').select('*').order('created_at',{ascending:false}),
    s.from('store_gender_summary').select('*'),
    s.from('reviews').select('*').eq('user_id',state.user.id).eq('status','pending'),
    s.from('store_requests').select('*').eq('user_id',state.user.id).order('created_at',{ascending:false}),
    s.from('admins').select('user_id').eq('user_id',state.user.id).maybeSingle()
  ]);
  for(const result of [stores,reviews,genderSummary,pending,req,adminRes])if(result.error)throw result.error;
  state.stores=stores.data||[];state.reviews=reviews.data||[];state.genderSummary=genderSummary.data||[];state.pending=pending.data||[];state.requests=req.data||[];state.admin=!!adminRes.data;
  if(state.admin)await loadAdminRemote();
}

function needsVerification(r){return num(r.hourly_wage)>6000||num(r.weekly_capacity)>6||num(r.paid_hours)>12||/[0-9]{3}[- ]?[0-9]{4}[- ]?[0-9]{4}|@/.test(String(r.good_points||'')+' '+String(r.bad_points||''))}
function reviewCard(r,category){const days=state.days;const m=reviewMonthly(r,days,category,'monthly');const eff=reviewMonthly(r,days,category,'effective');return `<article class="review"><div class="review-head"><span class="review-amount">${escapeHtml(payLabel(r))}</span><span class="review-tag">${escapeHtml(r.worked_months)}か月勤務 · ${escapeHtml(new Date(r.created_at).toLocaleDateString('ja-JP'))}</span></div><div class="tag-row"><span class="tag">週勤務可能 ${r.weekly_capacity?escapeHtml(r.weekly_capacity)+(paymentKind(r)==='lesson'?'コマ':'回'):'未入力'}</span><span class="tag">標準月収 ${m===null?'対象外・未入力':yen(m)}</span><span class="tag">実質月収 ${eff===null?'未算出':fmt(eff)+'pt'}</span><span class="tag">忙しさ ${escapeHtml(r.busyness)}/5</span><span class="tag">人間関係 ${escapeHtml(r.relationships)}/5</span><span class="tag">ルール厳しさ ${r.rules_strictness?escapeHtml(r.rules_strictness)+'/5':'未入力'}</span><span class="tag">スキル評価 ${skillValue(r)?.toFixed(1)??'未入力'}/5</span></div>${needsVerification(r)?'<span class="verification-flag">⚠ 内容の確認が必要な可能性があります（自動チェック）</span>':''}<div class="review-label">身だしなみなどのルール</div><p class="review-text">髪色：${RULES[r.hair_rule]||'未入力'} ／ ネイル：${RULES[r.nail_rule]||'未入力'} ／ アクセサリー：${RULES[r.accessory_rule]||'未入力'} ／ 制服：${({provided:'貸与',own:'自費購入',none:'私服',unknown:'不明'})[r.uniform_rule]||'未入力'} ／ マスク：${({required:'着用義務',forbidden:'着用制限',optional:'自由',unknown:'不明'})[r.mask_rule]||'未入力'}</p><div class="review-label">良かった点</div><p class="review-text">${escapeHtml(r.good_points)}</p><div class="review-label">気になった点</div><p class="review-text">${escapeHtml(r.bad_points)}</p><div class="review-foot"><span>匿名の投稿者による自己申告</span><button class="text-button" data-action="report" data-id="${escapeHtml(r.id)}">この口コミを通報</button></div></article>`}
function detail(){const store=state.stores.find(x=>x.id===state.storeId);if(!store)return `<main class="container page">勤務先が見つかりません。</main>`;const rs=reviewed(store.id);const med=metricForStore(store,'hourly').value;const monthly=metricForStore(store,'monthly').value;const effective=metricForStore(store,'effective').value;const bs=avg(rs.map(r=>num(r.busyness)));const rel=avg(rs.map(r=>num(r.relationships)));const rules=avg(rs.map(r=>num(r.rules_strictness)).filter(Boolean));const gender=rs.map(r=>r.gender_balance).filter(x=>x&&x!=='unknown');const counts=gender.reduce((x,k)=>(x[k]=(x[k]||0)+1,x),{});const dominant=DEMO_MODE?(gender.length>=3?Object.entries(counts).sort((a,b)=>b[1]-a[1])[0][0]:null):state.genderSummary.find(x=>x.store_id===store.id)?.common_gender;return `<main class="container page"><button class="back" data-action="go-home">← 一覧に戻る</button><div class="detail-hero"><div><div class="detail-top"><div class="category-icon ${escapeHtml(store.category)}">${CAT_ICON[store.category]}</div><div><h1 class="detail-title">${escapeHtml(store.name)}</h1><div class="detail-meta">📍 ${escapeHtml(store.area)} ・ ${escapeHtml(CAT[store.category])}</div></div></div><div class="detail-desc">${escapeHtml(store.description||'口コミを確認できます。')}</div></div><button class="btn" data-action="go-write" data-id="${escapeHtml(store.id)}">＋ 口コミを書く</button></div><div class="work-filter"><label for="work-days">比較する週勤務回数（コマ制はコマ数）</label><select id="work-days">${[1,2,3,4,5,6].map(n=>`<option value="${n}" ${state.days===n?'selected':''}>週${n}日</option>`).join('')}</select></div><div class="detail-grid"><div><section class="panel"><h3>職場の比較指標</h3><p class="panel-sub">公開口コミ${rs.length}件。数値は各条件を満たす口コミの中央値です。</p><div class="summary-grid"><div class="summary-tile"><div class="tiny">換算時給</div><div class="big">${med===null?'—':fmt(med)}<small>円</small></div></div><div class="summary-tile"><div class="tiny">標準月収</div><div class="big">${monthly===null?'—':fmt(monthly)}<small>円</small></div></div><div class="summary-tile"><div class="tiny">実質月収</div><div class="big">${effective===null?'—':fmt(effective)}<small>pt</small></div></div></div>${[['忙しさ（5＝忙しい）',bs],['人間関係（5＝良好）',rel],['ルールの厳しさ（5＝厳しい）',rules]].map(([l,v])=>`<div class="bar-line"><span>${l}</span><span>${v===null?'—':v.toFixed(1)}</span></div><div class="bar-outer"><div class="bar-inner" style="width:${v===null?0:Math.min(100,v/5*100)}%"></div></div>`).join('')}<div class="outline-top"><div class="bar-line"><span>職場の男女比（参考）</span><span>${dominant?GB[dominant]:'回答数不足'}</span></div><p class="footnote">有効回答3件以上の場合のみ表示。ランキングの得点には含みません。</p></div></section><section class="panel"><h3>口コミ <span class="count-dot">${rs.length}</span></h3>${rs.length?rs.map(r=>reviewCard(r,store.category)).join(''):'<p class="muted">まだ口コミがありません。</p>'}</section></div><aside><section class="panel"><h3>実質月収の計算</h3><p class="panel-sub">基本の給与に賄いの経済価値を加え、交通費自己負担を引き、環境とスキルを補正します。</p><div class="hint-box">(標準月収 ＋ 賄いの経済価値 − 交通費自己負担) × K<br>K = 1 − 職場負担率 × (1 − 給与による負担緩和率) ＋ スキル加点率</div><p class="footnote">実質月収は金額風のスコアであり手取り給与ではありません。${escapeHtml(benchmarkNote())}</p></section><section class="panel"><h3>投稿を募集しています</h3><p class="panel-sub">匿名・即時公開。良い点と気になる点を具体的に書いてください。</p><button class="btn block" data-action="go-write" data-id="${escapeHtml(store.id)}">この職場の口コミを書く</button></section></aside></div></main>`}
function formInput(label,name,type='number',opts={}){const {placeholder='',required=false,min='',max='',step='any',hint='',value=undefined}=opts;return `<div class="field"><label for="${name}">${label}${required?' <span class="required">必須</span>':''}</label>${hint?`<div class="hint">${hint}</div>`:''}<input id="${name}" name="${name}" type="${type}" ${required?'required':''} ${min!==''?`min="${min}"`:''} ${max!==''?`max="${max}"`:''} step="${step}" value="${escapeHtml(value!==undefined?value:placeholder)}" placeholder="${escapeHtml(placeholder)}"></div>`}
function selectInput(label,name,options){return `<div class="field"><label for="${name}">${label} <span class="required">必須</span></label><select name="${name}" id="${name}" required>${options.map(([v,t])=>`<option value="${escapeHtml(v)}">${escapeHtml(t)}</option>`).join('')}</select></div>`}
function ratingInput(label,name,help){return `<div class="field rating-field"><div class="range-label"><label for="${name}">${label}</label><span id="${name}-value">3 / 5</span></div>${help?`<div class="hint">${help}</div>`:''}<input type="range" class="range" id="${name}" name="${name}" min="1" max="5" step="1" value="3"><div style="display:flex;justify-content:space-between;font-size:10px;color:#928d92"><span>1</span><span>5</span></div></div>`}
function writePage(){const chosen=state.storeId||'';const ruleChoices=[['unknown','不明・該当なし'],['free','自由'],['conditional','一部制限'],['strict','厳格・禁止']];return `<main class="container page"><div class="form-shell"><button class="back" data-action="go-home">← 一覧へ戻る</button><h1>アルバイトの口コミを書く</h1><p class="lead">勤務先は非公開のアカウントから匿名で投稿。投稿内容は自動チェックと通報による確認の対象になります。投稿後すぐに公開されます。通報や異常値チェックで後から確認できます。</p><form id="review-form"><div class="form-card"><div class="form-section-title">01　勤務先・時給・勤務できる日数</div><div class="field"><label for="store_id">勤務先 <span class="required">必須</span></label><input id="store-search" type="search" list="store-pick-list" autocomplete="off" required value="${escapeHtml(state.stores.find(x=>x.id===chosen)?pickStoreName(state.stores.find(x=>x.id===chosen)):'')}" placeholder="店名・エリアを入力して候補から選択"><datalist id="store-pick-list">${storePickerOptions()}</datalist><input type="hidden" name="store_id" id="store_id" value="${escapeHtml(chosen)}"><div class="hint">見つからない場合は <a href="#request">勤務先をその場で追加</a> へ。</div></div><div class="form-row"><div class="field pay-selector"><label for="pay_type">給与体系 <span class="required">必須</span></label><select id="pay_type" name="pay_type"><option value="hourly">時給制</option><option value="lesson">コマ制</option><option value="daily">日給制</option></select></div><div id="hourly-inputs" class="pay-fields">${formInput('基本時給（円）','hourly_wage','number',{min:1,max:100000,step:10,required:true,value:1400})}${formInput('1回の有給勤務時間（時間）','paid_hours','number',{min:.5,max:24,step:.5,required:true,value:5})}${formInput('週に勤務できる日数（最大）','weekly_capacity','number',{min:1,max:7,step:1,required:true,value:3,hint:'職場側が通常受け入れてくれる最大日数。自分の希望日数ではありません'})}</div><div id="unit-inputs" class="pay-fields" hidden>${formInput('1コマあたりの報酬（円）','unit_pay','number',{min:1,max:200000,step:10,value:2000})}${formInput('1コマの合計勤務時間（時間）','unit_total_hours','number',{min:.25,max:24,step:.25,value:1.5,hint:'授業・準備・片付け・無給の残業をすべて含む拘束時間'})}${formInput('週のコマ数（最大）','unit_weekly_capacity','number',{min:1,max:40,step:1,value:5,hint:'職場側が通常入れてくれるコマ数'})}</div>${formInput('賄いの通常販売価格（円/回）','meal_value','number',{min:0,max:3000,step:50,required:true,value:0,hint:'勤務時に食べられるものを通常購入した場合の税込販売価格。賄いがなければ0円'})}${formInput('賄いの自己負担額（円/回）','meal_cost','number',{min:0,max:3000,step:50,required:true,value:0,hint:'無料なら0円。実質月収には「通常販売価格−自己負担額」を反映します'})}<div id="hourly-unpaid">${formInput('無給の拘束時間（分/回）','unpaid_minutes','number',{min:0,max:480,step:5,required:true,value:0})}</div>${formInput('交通費の自己負担（円/回）','commute_cost','number',{min:0,max:10000,step:1,required:true,value:0,hint:'全額支給なら0円'})}</div><div class="calc" style="display:block"><div><span style="font-size:12px;font-weight:800">入力内容から試算</span><small>週3回（コマ制は3コマ）を例に計算。口コミ公開後は閲覧者が週勤務数を変更できます。</small></div><div class="preview-grid"><div><small>標準月収</small><strong id="preview-monthly">—</strong></div><div><small>実質月収スコア</small><strong id="preview-effective">—</strong></div></div></div>${formInput('勤務経験（か月）','worked_months','number',{min:1,max:600,required:true,step:1,value:6})}</div><div class="form-card"><div class="form-section-title">02　職場環境・身だしなみルール</div>${ratingInput('忙しさ','busyness','1＝暇・5＝非常に忙しい')}${ratingInput('人間関係','relationships','1＝悪い・5＝良い')}${ratingInput('シフトの自由度','flexibility','1＝融通が利かない・5＝自由')}${ratingInput('ルール全体の厳しさ','rules_strictness','1＝緩い・5＝かなり厳しい')}${selectInput('髪色','hair_rule',ruleChoices)}${selectInput('ネイル','nail_rule',ruleChoices)}${selectInput('アクセサリー・ピアス','accessory_rule',ruleChoices)}${selectInput('制服','uniform_rule',[['unknown','不明'],['none','私服'],['provided','制服貸与'],['own','自費購入']])}${selectInput('マスク','mask_rule',[['unknown','不明'],['optional','自由'],['required','着用義務'],['forbidden','着用制限']])}<div class="field"><label for="gender_balance">男女比（任意）</label><select id="gender_balance" name="gender_balance"><option value="unknown">回答しない</option><option value="men">男性が多い</option><option value="similar">ほぼ同じ</option><option value="women">女性が多い</option></select><div class="hint">スコアには含めず、3件以上集まった場合のみ参考表示します。</div></div></div><div class="form-card"><div class="form-section-title">03　スキル・就活につながる経験</div><p class="panel-sub">知名度ではなく、実際に身についた経験を評価してください。</p>${ratingInput('専門スキル','skill_specialty','語学・指導・営業・IT・調理など')}${ratingInput('対人能力','skill_communication','接客・説明・交渉など')}${ratingInput('主体性','skill_initiative','工夫・改善提案・判断など')}${ratingInput('リーダー経験','skill_leadership','新人指導・チーム運営など')}${ratingInput('就活で説明できる経験','skill_career','自身の具体的な工夫・成果を語れるか')}</div><div class="form-card"><div class="form-section-title">04　体験談</div><div class="field"><label for="good_points">良かった点 <span class="required">必須</span></label><textarea id="good_points" name="good_points" minlength="10" maxlength="500" required placeholder="働いて良かったことや習得した能力を具体的に"></textarea></div><div class="field"><label for="bad_points">気になった点 <span class="required">必須</span></label><textarea id="bad_points" name="bad_points" minlength="10" maxlength="500" required placeholder="事実と感想を分けて記入してください"></textarea></div><div class="hint-box">投稿ルール：勤務経験に基づく情報のみ。実名・連絡先・個人を特定する特徴、根拠のない違法行為の断定、差別的表現は禁止。口コミは即時公開されます。違反の報告があれば事後対応します。</div><label class="checks" style="margin:20px 0"><input type="checkbox" name="agree" required><span>投稿ルールに同意します。</span></label><button class="btn block" type="submit">口コミを公開する →</button><p class="footnote">${DEMO_MODE?'デモではこのブラウザ内に保存されます。':'投稿すると即時公開されます。通報に基づいて事後確認します。'}</p></div></form></div></main>`}
function requestPage(){return `<main class="container page"><div class="form-shell"><button class="back" data-action="go-home">← 戻る</button><h1>勤務先を追加</h1><p class="lead">勤務先をすぐに登録できます。情報は未確認ラベル付きで公開され、通報・修正の対象になります。</p><form id="request-form" class="form-card"><div class="form-section-title">新しい勤務先の情報</div>${formInput('勤務先・店舗名','store_name','text',{required:true,placeholder:'正式な店名を入力'})}<div class="field"><label for="store_station">最寄駅 <span class="required">必須</span></label><input id="store_station" name="store_station" list="station-list" required autocomplete="off" placeholder="駅を検索・選択"><datalist id="station-list">${stationOptions()}</datalist><div class="hint">駅名を入力し、候補から選択してください。路線による絞り込みにも使われます。</div></div>${selectInput('大分類','store_category',Object.entries(CAT))}<div class="field"><label for="store_subcategory">詳しい職種 <span class="required">必須</span></label><select name="store_subcategory" id="store_subcategory" required></select></div><label class="checks" style="margin:14px 0"><input type="checkbox" required><span>実在する勤務先の情報を登録します。個人の氏名や連絡先は入力しません。</span></label><button type="submit" class="btn block">この勤務先をすぐ追加する</button></form></div></main>`}
function minePage(){const mine=[...state.reviews,...state.pending].filter(r=>r.user_id===state.user?.id);return `<main class="container page"><button class="back" data-action="go-home">← 戻る</button><div class="content-head"><div><h2>自分の投稿</h2><p>投稿後すぐに公開されます。公開画面には投稿者の個人情報は表示されません。</p></div></div>${mine.length?mine.map(r=>`<div class="admin-card"><span class="mod-state">${r.status==='approved'?'公開中':'保留中'}</span><h3 style="margin:11px 0 5px">${escapeHtml(state.stores.find(s=>s.id===r.store_id)?.name||'勤務先')}</h3><p class="review-text">${escapeHtml(r.good_points)}</p><button class="btn secondary sm" data-action="open-store" data-id="${escapeHtml(r.store_id)}">口コミを見る</button></div>`).join(''):`<div class="empty"><div class="emoji">✍️</div><strong>まだ投稿がありません</strong><button class="btn secondary sm" data-action="go-write">口コミを書く</button></div>`}</main>`}
function aboutPage(){return `<main class="container page"><div class="form-shell"><button class="back" data-action="go-home">← 戻る</button><h1>バイトのリアルについて</h1><p class="lead">企業の求人広告ではなく、学生のリアルな体験を中心にした、独立した口コミサイトを目指しています。</p><section class="panel"><h3>運営方針</h3><p class="review-text">企業から依頼を受けて、口コミ評価や算定値を変更しません。良い意見と気になる意見には同じ基準を適用し、事実の誤りについては訂正・通報を受け付けます。</p><p class="review-text">掲載された評価は個人の主観的な経験であり、事業者の品質を断定するものではありません。不審な投稿は注意表示・非公開・異議申し立ての対象にします。現在のデモは数値や連絡先の形式に対する簡易チェックのみです。AIによる自動巡回・非公開判定は本番用のサーバー実装が必要で、現段階では稼働していません。</p></section><section class="panel"><h3>3つの比較指標</h3><div class="hint-box">換算時給＝1回の報酬÷拘束時間<br>標準月収＝1回の報酬×週勤務回数×52÷12<br>実質月収スコア＝（標準月収＋賄いの経済価値−自己負担交通費）×K<br>K＝1−負担率×(1−平均時給超過による緩和率)＋スキル加点率</div><p class="review-text">スキル加点の上限はデモ初期値15％（変更可能な仮値）。負担率の上限20％、給与による緩和率の上限50％。実際の給与ではなく比較用スコアです。${escapeHtml(benchmarkNote())}</p></section><section class="panel"><h3>匿名性と認証</h3><p class="review-text">公開ページに投稿者のメールアドレスは表示しません。${DEMO_MODE?'現在の体験版はログインや本人確認を行わず、データはこのブラウザに保存します。':'現在の認証は早稲田メールアドレスの受信確認のみです。早稲田メールは卒業生も利用可能なため、現役学生限定を厳密に保証する仕組みではありません。'}学生本人の在籍確認を厳密に行うには別途手段が必要です。</p></section><section class="panel"><h3>今後の開発候補</h3><p class="review-text">現役学生の在籍確認、管理者による審査画面の改善、口コミの訂正申請、勤務先の事実確認、統計データの公開。個人年収ランキングは次の開発段階で検討します。</p></section></div></main>`}
function adminPage(){if(!state.admin)return `<main class="container page"><div class="empty">管理者のみ利用できます。</div></main>`;const pend=DEMO_MODE?state.pending:(state.adminPending||[]);const req=DEMO_MODE?state.requests.filter(r=>r.status==='pending'):(state.adminRequests||[]);const reports=DEMO_MODE?state.reports.filter(r=>r.status==='pending'):(state.reports||[]);return `<main class="container page"><button class="back" data-action="go-home">← 戻る</button><div class="content-head"><div><h2>通報管理</h2><p>${DEMO_MODE?'デモ管理画面：自分の投稿を承認して公開動作を確認できます。':'管理者用：事実確認が必要な投稿は承認せず保留してください。'}</p></div></div><h3>旧バージョンの保留中口コミ <span class="count-dot">${pend.length}</span></h3>${pend.length?pend.map(r=>`<article class="admin-card"><b>${escapeHtml(state.stores.find(s=>s.id===r.store_id)?.name||'店舗')}</b><div class="tag-row"><span class="tag">基本時給 ${yen(Number(r.hourly_wage))}</span><span class="tag">実質時給 ${yen(actualWage(r))}</span></div><div class="review-label">良かった点</div><p class="review-text">${escapeHtml(r.good_points)}</p><div class="review-label">気になる点</div><p class="review-text">${escapeHtml(r.bad_points)}</p><div class="admin-actions"><button class="btn sm" data-action="approve-review" data-id="${escapeHtml(r.id)}">承認して公開</button><button class="btn ghost sm" data-action="reject-review" data-id="${escapeHtml(r.id)}">却下</button></div></article>`).join(''):'<div class="hint-box">審査待ちの口コミはありません。</div>'}<h3 class="section-space">勤務先の追加申請 <span class="count-dot">${req.length}</span></h3>${req.length?req.map(r=>`<div class="admin-card"><b>${escapeHtml(r.name)}</b><p class="meta">${escapeHtml(r.area)} / ${escapeHtml(CAT[r.category]||'その他')}</p><div class="admin-actions"><button class="btn sm" data-action="approve-request" data-id="${escapeHtml(r.id)}">確認済みとして追加</button><button class="btn ghost sm" data-action="reject-request" data-id="${escapeHtml(r.id)}">却下</button></div></div>`).join(''):'<div class="hint-box">追加申請はありません。</div>'}<h3 class="section-space">通報 <span class="count-dot">${reports.length}</span></h3>${reports.length?reports.map(r=>`<div class="admin-card"><b>口コミID: ${escapeHtml(r.review_id)}</b><p class="review-text">${escapeHtml(r.reason)}</p><div class="admin-actions"><button class="btn ghost sm" data-action="dismiss-report" data-id="${escapeHtml(r.id)}">対応済みにする</button><button class="btn sm" data-action="hide-review" data-id="${escapeHtml(r.review_id)}">口コミを非公開にする</button></div></div>`).join(''):'<div class="hint-box">新しい通報はありません。</div>'}</main>`}
function authPage(){return `<main class="container"><div class="auth-wrap"><div class="auth-symbol">✉️</div><h1>早稲田メールでログイン</h1><p>口コミを守るため、早稲田メールの受信確認が必要です。メールアドレスは口コミページに公開されません。</p><form id="login-form"><div class="field" style="text-align:left"><label for="login-email">Wasedaメールアドレス</label><input id="login-email" type="email" required placeholder="name@akane.waseda.jp" autocomplete="email"></div><button class="btn block" type="submit">ログイン用メールを送信</button></form><p class="source-note">学生用として案内されるサブドメインに対応しています。卒業生にもアドレスが残るため、現役在籍の確認とは異なります。</p></div></main>`}
function showEffectiveIntro(){const modal=document.createElement('div');modal.className='intro-overlay';modal.id='effective-intro';modal.innerHTML=`<section class="intro-dialog" role="dialog" aria-modal="true" aria-labelledby="effective-intro-title"><div class="intro-illustration">¥ + ♡ + ✦</div><h2 id="effective-intro-title">お金だけでは測れない、バイトの価値。</h2><p>同じ月収でも、職場の忙しさや人間関係、身につくスキルによって「働いてよかった」と感じる度合いは違います。</p><p>実質月収は、<strong>稼ぎやすさ・働きやすさ・将来につながる経験</strong>を一つの目安にまとめた比較スコアです。</p><div class="intro-caution">給与として受け取れる金額ではありません。職場の評価は経験者の回答に基づく暫定的な目安です。</div><button class="btn block" data-action="close-effective-intro">ランキングを見る</button></section>`;document.body.appendChild(modal);modal.addEventListener('click',e=>{if(e.target===modal)closeEffectiveIntro()});modal.querySelector('button')?.focus()}
function closeEffectiveIntro(){document.querySelector('#effective-intro')?.remove()}
function render(){const root=$('#app');let body;if(!DEMO_MODE&&!state.user)body=authPage();else body=state.route==='home'?home():state.route==='store'?detail():state.route==='write'?writePage():state.route==='request'?requestPage():state.route==='mine'?minePage():state.route==='admin'?adminPage():aboutPage();root.innerHTML=header()+body+footer()+`<button class="btn floating" data-action="go-write">＋ 口コミを書く</button>`;wireFormPreview();updateSubcategories()}
function updateSubcategories(){const cat=$('#store_category'),sub=$('#store_subcategory');if(!cat||!sub)return;const existing=sub.value;sub.innerHTML=(SUBCATS[cat.value]||[]).map(n=>`<option value="${escapeHtml(n)}">${escapeHtml(n)}</option>`).join('');if([...sub.options].some(x=>x.value===existing))sub.value=existing}
function updatePaymentType(){const kind=$('#pay_type')?.value||'hourly';const hourly=kind==='hourly';const hi=$('#hourly-inputs'),ui=$('#unit-inputs'),un=$('#hourly-unpaid');if(!hi||!ui)return;hi.hidden=!hourly;ui.hidden=hourly;if(un)un.hidden=!hourly;for(const el of hi.querySelectorAll('input'))el.required=hourly;for(const el of ui.querySelectorAll('input'))el.required=!hourly;const labels={lesson:['1コマの報酬（円）','1コマの合計勤務時間（時間）','週のコマ数（最大）'],daily:['日給（円）','1日の合計勤務時間（時間）','週の勤務回数（最大）']};if(!hourly){const l=labels[kind];['unit_pay','unit_total_hours','unit_weekly_capacity'].forEach((id,i)=>{const e=document.querySelector(`label[for="${id}"]`);if(e)e.textContent=l[i]+'  必須'});const hint=$('#unit_total_hours')?.closest('.field')?.querySelector('.hint');if(hint)hint.textContent=kind==='lesson'?'授業・準備・片付け・無給残業を含む1コマの拘束時間':'準備・片付け・無給残業を含む1日の拘束時間';}if(un?.querySelector('input'))un.querySelector('input').required=hourly}
function wireFormPreview(){const f=$('#review-form');if(!f)return;const update=()=>{resolveStore($('#store-search'));const d=new FormData(f);const obj=Object.fromEntries(d.entries());if(obj.pay_type!=='hourly'){obj.weekly_capacity=obj.unit_weekly_capacity;obj.unit_pay=obj.unit_pay;obj.unit_total_hours=obj.unit_total_hours;}const store=state.stores.find(x=>x.id===obj.store_id);const days=Math.min(3,num(obj.weekly_capacity,0));const monthly=days>0?reviewMonthly(obj,days,store?.category,'monthly'):null;const effective=days>0?reviewMonthly(obj,days,store?.category,'effective'):null;$('#preview-monthly').textContent=monthly===null?'—':yen(monthly);$('#preview-effective').textContent=effective===null?'—':fmt(effective)+' pt';for(const name of ['busyness','relationships','flexibility','rules_strictness','skill_specialty','skill_communication','skill_initiative','skill_leadership','skill_career']){const el=$(`#${name}-value`);if(el)el.textContent=`${d.get(name)} / 5`}};f.addEventListener('input',update);f.addEventListener('change',update);updatePaymentType();update()}
async function postReview(form){resolveStore($('#store-search'));const d=new FormData(form);const store_id=String(d.get('store_id'));if(!state.stores.some(s=>s.id===store_id))throw Error('勤務先を検索し、表示された候補から選択してください。');const kind=String(d.get('pay_type')||'hourly');if(!['hourly','lesson','daily'].includes(kind))throw Error('給与体系を選択してください。');const fields=['hourly_wage','paid_hours','weekly_capacity','unit_pay','unit_total_hours','unit_weekly_capacity','meal_value','meal_cost','unpaid_minutes','commute_cost','worked_months','busyness','relationships','flexibility','rules_strictness','skill_specialty','skill_communication','skill_initiative','skill_leadership','skill_career'];const nums=Object.fromEntries(fields.map(k=>[k,Number(d.get(k)||0)]));if(kind==='hourly'){if(!nums.hourly_wage||nums.hourly_wage>100000||nums.paid_hours<.5||nums.paid_hours>24||nums.weekly_capacity<1||nums.weekly_capacity>7||nums.unpaid_minutes<0||nums.unpaid_minutes>480)throw Error('時給制の勤務条件を確認してください。')}else{if(!nums.unit_pay||nums.unit_pay>200000||nums.unit_total_hours<.25||nums.unit_total_hours>24||nums.unit_weekly_capacity<1||nums.unit_weekly_capacity>(kind==='lesson'?40:7))throw Error('コマ制・日給制の勤務条件を確認してください。');nums.weekly_capacity=nums.unit_weekly_capacity;nums.hourly_wage=equivalentHourly({...nums,pay_type:kind});nums.paid_hours=nums.unit_total_hours;nums.unpaid_minutes=0}if(nums.meal_value<0||nums.meal_value>3000||nums.meal_cost<0||nums.meal_cost>3000||nums.meal_cost>nums.meal_value||nums.commute_cost<0||nums.commute_cost>10000||nums.worked_months<1||nums.worked_months>600||fields.slice(11).some(k=>nums[k]<1||nums[k]>5))throw Error('勤務条件や各評価を確認してください。');const good_points=String(d.get('good_points')||'').trim(),bad_points=String(d.get('bad_points')||'').trim();if(good_points.length<10||bad_points.length<10)throw Error('良かった点と気になった点は10文字以上必要です。');if(!d.get('agree'))throw Error('投稿ルールへの同意が必要です。');const payload={...nums,pay_type:kind,store_id,good_points,bad_points,gender_balance:String(d.get('gender_balance')||'unknown'),hair_rule:String(d.get('hair_rule')),nail_rule:String(d.get('nail_rule')),accessory_rule:String(d.get('accessory_rule')),uniform_rule:String(d.get('uniform_rule')),mask_rule:String(d.get('mask_rule')),user_id:state.user.id,status:'approved'};if(DEMO_MODE){if(state.reviews.some(r=>r.store_id===store_id&&r.user_id===state.user.id))throw Error('同じ勤務先へは1件だけ投稿できます。');state.reviews.unshift({...payload,id:newId(),created_at:new Date().toISOString()});saveDemo()}else{const {error}=await state.supabase.from('reviews').insert(payload);if(error)throw error;await reloadRemote()}toast('口コミを公開しました。');navigate('#store/'+store_id)}
async function postRequest(form){const d=new FormData(form);const name=String(d.get('store_name')||'').trim(),station=stationName(d.get('store_station')),area=station,category=String(d.get('store_category')||''),subcategory=String(d.get('store_subcategory')||'');if(name.length<2||area.length<2)throw Error('店舗名とエリアを入力してください。');if(!STATIONS.some(([n])=>n===station))throw Error('候補にある最寄駅を選んでください。');if(!CAT[category]||!(SUBCATS[category]||[]).includes(subcategory))throw Error('職種を選択してください。');const payload={name,area,station,category,subcategory,status:'unverified',description:'利用者が登録した未確認の勤務先です。',is_active:true};if(state.stores.some(x=>x.name.trim().toLowerCase()===name.toLowerCase() && x.area.trim().toLowerCase()===area.toLowerCase()))throw Error('同じ名称・エリアの勤務先がすでに登録されています。');if(DEMO_MODE){state.stores.unshift({...payload,id:newId(),created_at:new Date().toISOString()});saveDemo()}else{const {error}=await state.supabase.from('stores').insert({name,area,category,description:payload.description});if(error)throw error;await reloadRemote()};toast('勤務先を追加しました（未確認）。口コミを書けます。');navigate('#home')}
async function reportReview(reviewId){const reason=window.prompt('通報理由を入力してください（個人情報、事実と異なる内容、攻撃的表現など）。');if(reason===null)return;if(!reason.trim()){toast('通報理由を入力してください。');return}if(DEMO_MODE){state.reports.unshift({id:newId(),review_id:reviewId,reason:reason.trim().slice(0,500),status:'pending'});saveDemo()}else{const {error}=await state.supabase.from('reports').insert({review_id:reviewId,reason:reason.trim().slice(0,500),reporter_id:state.user.id});if(error)throw error;}toast('通報を受け付けました。')}
async function moderate(action,id){if(!state.admin)throw Error('権限がありません。');const s=state.supabase;if(action==='approve-review'||action==='reject-review'){const approved=action==='approve-review',status=approved?'approved':'rejected';if(DEMO_MODE){const target=state.pending.find(r=>r.id===id);if(!target)return;if(approved)state.reviews.unshift({...target,status});state.pending=state.pending.filter(r=>r.id!==id);saveDemo()}else{const {error}=await s.from('reviews').update({status}).eq('id',id);if(error)throw error;await reloadRemote()}}else if(action==='approve-request'||action==='reject-request'){const approved=action==='approve-request';const request=DEMO_MODE?state.requests.find(r=>r.id===id):(state.adminRequests||[]).find(r=>r.id===id);if(!request)return;if(DEMO_MODE){request.status=approved?'approved':'rejected';if(approved)state.stores.push({id:newId(),name:request.name,area:request.area,category:request.category,description:'新しく追加された勤務先です。'});saveDemo()}else{if(approved){const {error:err}=await s.from('stores').insert({name:request.name,area:request.area,category:request.category,description:'学生から追加申請された勤務先です。'});if(err)throw err}const {error}=await s.from('store_requests').update({status:approved?'approved':'rejected'}).eq('id',id);if(error)throw error;await reloadRemote()}}else if(action==='dismiss-report'){if(DEMO_MODE){const r=state.reports.find(r=>r.id===id);if(r)r.status='resolved';saveDemo()}else{const {error}=await s.from('reports').update({status:'resolved'}).eq('id',id);if(error)throw error;await reloadRemote()}}else if(action==='hide-review'){if(DEMO_MODE){state.reviews=state.reviews.filter(r=>r.id!==id);state.reports.forEach(r=>{if(r.review_id===id)r.status='resolved'});saveDemo()}else{const {error}=await s.from('reviews').update({status:'hidden'}).eq('id',id);if(error)throw error;await reloadRemote()}}toast('審査結果を保存しました。');render()}
document.addEventListener('click',async e=>{const target=e.target.closest('[data-action]');if(!target)return;const action=target.dataset.action,id=target.dataset.id;try{if(action==='go-home')navigate('#home');if(action==='go-write'){state.storeId=id||null;navigate('#write')}if(action==='go-request')navigate('#request');if(action==='open-store')navigate('#store/'+id);if(action==='filter'){state.category=id;render()}if(action==='metric'){state.metric=id;state.sort='metric';render();if(id==='effective'&&!sessionStorage.getItem('effective-intro-seen-v3')){sessionStorage.setItem('effective-intro-seen-v3','1');showEffectiveIntro()}}if(action==='close-effective-intro')closeEffectiveIntro();if(action==='show-effective-intro')showEffectiveIntro();if(action==='search'){state.search=$('#main-search')?.value.trim()||'';render()}if(action==='toggle-stations'){state.stationPickerOpen=!state.stationPickerOpen;render()}if(action==='remove-station'){state.stationFilter=state.stationFilter.filter(x=>x!==id);render()}if(action==='clear-stations'){state.stationFilter=[];render()}if(action==='report')await reportReview(id);if(action==='signout'){await state.supabase.auth.signOut();state.user=null;render()}if(action==='mobile-menu'){const links=state.admin?'職場を探す / 投稿を確認 / 通報管理':'職場を探す / 投稿を確認';const choice=window.prompt(`${links}\n\n1: 職場一覧 / 2: 自分の投稿 / 3: 使い方${state.admin?' / 4: 通報管理':''}`,'1');if(choice==='1')navigate('#home');if(choice==='2')navigate('#mine');if(choice==='3')navigate('#about');if(choice==='4'&&state.admin)navigate('#admin')};if(['approve-review','reject-review','approve-request','reject-request','dismiss-report','hide-review'].includes(action))await moderate(action,id)}catch(err){toast(err.message||'操作に失敗しました')}});
document.addEventListener('change',e=>{if(e.target.id==='sort'){state.sort=e.target.value;render()}if(e.target.id==='work-days'){state.days=Number(e.target.value);render()}if(e.target.id==='line-filter'){state.lineFilter=e.target.value;if(state.lineFilter)state.stationFilter=state.stationFilter.filter(n=>STATIONS.some(([sn,ls])=>sn===n&&ls.split('・').includes(state.lineFilter)));render()}if(e.target.matches('input[data-station]')){const n=e.target.dataset.station;state.stationFilter=e.target.checked?[...new Set([...state.stationFilter,n])]:state.stationFilter.filter(x=>x!==n);const focused=document.activeElement?.id==='station-query';render();state.stationPickerOpen=true;if(focused)$('#station-query')?.focus()}if(e.target.id==='store-search')resolveStore(e.target);if(e.target.id==='pay_type')updatePaymentType();if(e.target.id==='store_category')updateSubcategories()});
document.addEventListener('input',e=>{if(e.target.id==='station-query'){state.stationQuery=e.target.value;state.stationPickerOpen=true;const p=$('#station-options');if(p){p.classList.remove('is-hidden');updateStationPicker()}}if(e.target.id==='store-search')resolveStore(e.target)});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeEffectiveIntro();if(e.key==='Enter'&&e.target.id==='main-search'){e.preventDefault();state.search=e.target.value.trim();render()}});
document.addEventListener('submit',async e=>{if(!['review-form','request-form','login-form'].includes(e.target.id))return;e.preventDefault();const btn=e.target.querySelector('button[type=submit]');const before=btn?.textContent;if(btn){btn.disabled=true;btn.textContent='処理中…'}try{if(e.target.id==='review-form')await postReview(e.target);if(e.target.id==='request-form')await postRequest(e.target);if(e.target.id==='login-form')await login($('#login-email').value.trim())}catch(err){toast(err.message||'送信できませんでした')}finally{if(btn){btn.disabled=false;btn.textContent=before}}});
window.addEventListener('hashchange',()=>{parseHash();render()});
(async()=>{try{if(DEMO_MODE)initDemo();else await initRemote();parseHash();render()}catch(err){$('#app').innerHTML=`<div class="auth-wrap"><h1>読み込みに失敗しました</h1><p>${escapeHtml(err.message||'接続設定を確認してください。')}</p><p>デモで使う場合は config.js のキーを空欄にしてください。</p></div>`}})();

</script>
</body>

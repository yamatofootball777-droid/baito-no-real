:root{font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;color:#25232b;background:#faf9f8}*{box-sizing:border-box}body{margin:0}button,input,select,textarea{font:inherit}button{cursor:pointer}button:disabled{opacity:.5;cursor:not-allowed}a{color:#872347}header{background:#fff;border-bottom:1px solid #ebe7e8;position:sticky;top:0;z-index:10}.nav{max-width:1100px;margin:auto;display:flex;align-items:center;gap:18px;padding:15px 22px}.brand{font-weight:900;font-size:20px;letter-spacing:-.06em;white-space:nowrap}.mark{display:inline-flex;width:33px;height:33px;background:#872347;border-radius:10px;color:white;align-items:center;justify-content:center;margin-right:9px;font-size:15px}.navlinks{display:flex;gap:8px;margin-left:auto;align-items:center}.navbutton{border:0;background:transparent;border-radius:10px;padding:10px 12px;font-weight:700;color:#665e67;font-size:13px}.navbutton.active{background:#fae9ef;color:#8c2442}.container{max-width:1100px;margin:auto;padding:0 22px}.hero{background:linear-gradient(110deg,#f8eaf0,#fff9f5 80%);padding:48px 0 40px;border-bottom:1px solid #f3e6e8}.eyebrow{font-size:12px;letter-spacing:.11em;font-weight:900;color:#9b4966}.hero h1{font-size:clamp(28px,4vw,42px);line-height:1.4;margin:10px 0 11px;letter-spacing:-.04em}.hero p{color:#716970;line-height:1.9;margin:0}.layout{display:grid;grid-template-columns:minmax(0,1fr) 275px;gap:24px;padding-top:28px;padding-bottom:60px}.maincol{min-width:0}.panel,.post{background:white;border:1px solid #ede7e9;border-radius:17px;box-shadow:0 5px 18px #38202a08}.panel{padding:20px;margin-bottom:18px}.sidebar .panel{position:sticky;top:96px}.section-title{font-size:21px;letter-spacing:-.04em;margin:0 0 10px}.muted{color:#827a83}.small{font-size:12px}.hint{color:#756b75;font-size:13px;line-height:1.8}.pill{font-size:11px;border-radius:999px;background:#f5eff2;color:#76314b;padding:6px 10px;font-weight:800;display:inline-flex;align-items:center;gap:4px}.pill.neutral{background:#f2f1f0;color:#6e6870}.post{padding:24px;margin-bottom:17px}.post-head{display:flex;justify-content:space-between;gap:12px;align-items:start}.avatar{display:inline-flex;align-items:center;justify-content:center;width:36px;height:36px;background:#f3e5ec;color:#8c2442;border-radius:12px;font-weight:900}.person{display:flex;gap:10px;align-items:center}.post h3{font-size:21px;margin:16px 0 12px;letter-spacing:-.035em}.money{font-weight:900;color:#872347;font-size:26px}.money small{font-size:13px;color:#8a6f7c;font-weight:600}.chips{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0 17px}.chip{border:1px solid #e9e3e6;border-radius:8px;padding:7px 10px;color:#675f65;font-size:12px}.benefits{list-style:none;padding:0;margin:14px 0 20px}.benefits li{font-size:14px;margin:8px 0;line-height:1.55}.benefits li:before{content:'✓';color:#21845f;font-weight:900;margin-right:9px}.row{display:flex;gap:10px;align-items:center}.spread{justify-content:space-between}.btn{border:none;background:#8c2442;color:white;border-radius:10px;padding:12px 17px;font-weight:800;font-size:13px;min-height:42px}.btn:hover:not(:disabled){background:#711631}.btn.light{background:#faeaf0;color:#8c2442}.btn.light:hover:not(:disabled){background:#f5dbe4}.btn.outline{background:white;color:#7b354e;border:1px solid #e6cbd4}.btn.gray{background:#f1eff0;color:#605a62}.btn.full{width:100%}.actions{border-top:1px solid #f0ebed;padding-top:18px;display:flex;align-items:center;justify-content:space-between;gap:10px}.control{border:1px solid #ded7db;background:white;border-radius:10px;padding:12px;width:100%;min-width:0;outline-color:#ad7188}.filter{display:grid;grid-template-columns:1fr 180px 160px;gap:10px;margin-bottom:18px}.field{display:flex;flex-direction:column;gap:7px;margin-bottom:17px}.field label{font-size:13px;font-weight:800}.required{color:#b12a52;font-weight:900}.two{display:grid;grid-template-columns:1fr 1fr;gap:14px}.three{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px}.page{padding:31px 0 60px}.formpanel{max-width:780px;margin:auto;padding:27px}.formpanel h2{margin:0 0 8px}.formpanel h3{margin:28px 0 16px}.notice{background:#fff6ed;border:1px solid #f4e3ce;padding:13px 15px;border-radius:11px;font-size:13px;line-height:1.75;color:#73533b;margin:14px 0}.infobox{background:#f9f6f8;padding:15px;border-radius:12px;font-size:13px;color:#6b606a;line-height:1.75}.benefit-input{display:flex;align-items:center;gap:10px;margin:8px 0}.benefit-input span{width:18px;text-align:right;font-size:12px;color:#8c7c86}.tabline{display:flex;gap:7px;flex-wrap:wrap;margin:17px 0}.tabline button{border:1px solid #e5dce0;background:white;color:#695d65;padding:10px 13px;border-radius:9px;font-weight:800;font-size:12px}.tabline button.selected{background:#8c2442;color:white;border-color:#8c2442}.request{padding:18px;border:1px solid #ede7e9;border-radius:13px;margin:11px 0;background:white}.request .title{font-weight:800}.request .right{margin-left:auto;display:flex;gap:7px;flex-wrap:wrap}.empty{text-align:center;padding:45px 20px;color:#817780;border:1px dashed #dfd4da;border-radius:15px}.status{font-weight:700;font-size:12px;padding:5px 9px;background:#f2f0f1;border-radius:8px;color:#726a72}.status.yes{background:#e7f5ec;color:#247b4f}.status.no{background:#faf0ef;color:#a34642}.modalback{position:fixed;inset:0;background:#1b0b16a6;display:flex;align-items:center;justify-content:center;padding:18px;z-index:99}.modal{background:white;border-radius:18px;padding:25px;max-width:470px;width:100%;max-height:90vh;overflow:auto;box-shadow:0 20px 55px #170c163f}.modal h2{margin-top:0;font-size:21px}.modal .foot{display:flex;justify-content:flex-end;gap:8px;margin-top:20px}.metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.metric{background:#f9f5f7;border-radius:12px;padding:13px 9px;text-align:center}.metric strong{display:block;font-size:23px;color:#8c2442}.footer{border-top:1px solid #eee5e8;background:white;text-align:center;color:#817a81;font-size:12px;padding:24px}.hide{display:none!important}input[type=checkbox]{accent-color:#8c2442}select{appearance:auto}@media(max-width:830px){.layout{grid-template-columns:1fr}.sidebar{display:none}.nav{flex-wrap:wrap}.navlinks{gap:0}.navbutton{padding:9px 8px}.hero{padding:30px 0}.filter{grid-template-columns:1fr 1fr}.filter input{grid-column:1/-1}}@media(max-width:560px){.container{padding:0 15px}.brand{font-size:16px}.mark{width:28px;height:28px;margin-right:5px}.nav{padding:12px 13px;gap:7px}.navlinks{width:100%;justify-content:space-between;margin:0}.navbutton{font-size:12px}.post{padding:17px}.post h3{font-size:18px}.actions{align-items:stretch;flex-direction:column}.actions .btn{width:100%}.two,.three{grid-template-columns:1fr}.formpanel{padding:19px}.filter{grid-template-columns:1fr 1fr}.request .row{flex-wrap:wrap}.request .right{width:100%;margin-left:0}.hero h1{font-size:28px}}
</style></head><body><header><div class="nav"><div class="brand"><span class="mark">B</span>バイトのリアル</div><nav class="navlinks"><button class="navbutton active" data-page="browse">みんなの自慢</button><button class="navbutton" data-page="create">自慢を投稿</button><button class="navbutton" data-page="inbox">リクエスト <span id="navCount"></span></button><button class="navbutton" data-page="mine">マイページ</button></nav></div></header><main id="app"></main><div id="overlay"></div><footer class="footer">バイトのリアル MVP — デモ用の架空データです。学生のための仕事シェアサービス。</footer><script>
'use strict';
const KEY='baitoproud-mvp-20261127-v1';
const seedPosts=[{id:'p1',owner:'owner1',nickname:'カフェ好き',gender:'女性',grade:'大学2年',kind:'アルバイト',job:'カフェ',area:'新宿',workplace:'CAFE LUMI 新宿店（架空）',payType:'hour',pay:1700,hours:5,min:0,max:0,unit:'month',benefits:['賄いが毎回無料','週1日から働ける','同僚の仲がいい','制服がかわいい'],created:'2026-11-25T09:00:00Z'},{id:'p2',owner:'owner2',nickname:'インターン生',gender:'回答しない',grade:'大学3年',kind:'長期インターン',job:'Webマーケティング',area:'渋谷',workplace:'株式会社NOVA LAB（架空）',payType:'hour',pay:2200,hours:6,benefits:['リモート可','広告運用を任される','社員さんからフィードバックがもらえる'],created:'2026-11-24T09:00:00Z'},{id:'p3',owner:'owner3',nickname:'塾講師A',gender:'男性',grade:'大学1年',kind:'アルバイト',job:'個別指導塾',area:'高田馬場・早稲田',workplace:'個別指導スタディア（架空）',payType:'lesson',pay:3100,hours:1.8,benefits:['生徒の成長を実感できる','テスト前はシフト相談できる'],created:'2026-11-23T09:00:00Z'},{id:'p4',owner:'owner4',nickname:'営業好き',gender:'男性',grade:'大学4年',kind:'長期インターン',job:'営業',area:'池袋',workplace:'株式会社TERRACE（架空）',payType:'commission',min:30000,max:220000,unit:'month',benefits:['成果次第で高収入','商談経験が積める','社内の交流が活発'],created:'2026-11-22T09:00:00Z'}];
const emptyState=()=>({posts:seedPosts,requests:[],activeUser:'viewer',screen:'browse',search:'',area:'all',kind:'all'});
let data=(()=>{try{let v=JSON.parse(localStorage.getItem(KEY));return v&&Array.isArray(v.posts)&&Array.isArray(v.requests)?{...emptyState(),...v}:emptyState()}catch{return emptyState()}})();
let modal=null;
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(data))}catch{}};
const el=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const yen=n=>Math.round(Number(n)||0).toLocaleString('ja-JP')+'円';
const userName=uid=>uid==='viewer'?'あなた（閲覧者）':uid==='owner1'?'カフェ好き':uid==='owner2'?'インターン生':uid==='owner3'?'塾講師A':uid==='owner4'?'営業好き':data.posts.find(p=>p.owner===uid)?.nickname||'投稿者';
const requestFor=(postId,user)=>data.requests.find(r=>r.postId===postId&&r.requester===user);
const access=(post,user)=>post.owner===user||requestFor(post.id,user)?.status==='approved';
const wages=p=>p.payType==='hour'?`${yen(p.pay)} / 時間`:p.payType==='lesson'?`${yen(p.pay)} / コマ`:p.payType==='day'?`${yen(p.pay)} / 日`:p.payType==='commission'?`${yen(p.min)} 〜 ${yen(p.max)} / ${p.unit==='month'?'月':p.unit==='week'?'週':p.unit==='day'?'日':'件'}`:'無給';
const kindOpts=['アルバイト','長期インターン','短期インターン'];
const jobOpts=['カフェ','喫茶店','ファストフード','居酒屋','レストラン','ベーカリー','コンビニ','スーパー','アパレル','雑貨販売','ドラッグストア','ホテル','イベントスタッフ','試験監督','受付','コールセンター','個別指導塾','集団指導塾','家庭教師','採点','事務','データ入力','Webマーケティング','営業','エンジニア','デザイン','企画','ライター','研究補助','その他'];
const areaOpts=['高田馬場・早稲田','新宿','池袋','渋谷','原宿・表参道','東京・丸の内','秋葉原・御茶ノ水','中野','吉祥寺','下北沢','品川','上野','横浜','川崎','町田','立川','千葉','大宮','都内その他','首都圏その他','全国・リモート'];
const options=(arr,sel)=>arr.map(x=>`<option value="${esc(x)}" ${x===sel?'selected':''}>${esc(x)}</option>`).join('');
const nav=(page)=>{data.screen=page;save();render();scrollTo(0,0)};
const controls=()=>`<div class="panel"><div class="row spread"><strong>デモ用のアカウント切り替え</strong><span class="pill neutral">ブラウザ内のみ</span></div><p class="hint">閲覧者 → 投稿者に切り替えると、承認・拒否の操作を試せます。</p><select id="account" class="control" aria-label="デモアカウント">${[['viewer','あなた（閲覧者）'],['owner1','カフェ好き（投稿者）'],['owner2','インターン生（投稿者）'],['owner3','塾講師A（投稿者）'],['owner4','営業好き（投稿者）'],...data.posts.filter(p=>p.owner.startsWith('new:')).map(p=>[p.owner,p.nickname])].filter((v,i,a)=>a.findIndex(x=>x[0]===v[0])===i).map(([v,l])=>`<option value="${esc(v)}" ${data.activeUser===v?'selected':''}>${esc(l)}</option>`).join('')}</select></div>`;
const postCard=p=>{const own=p.owner===data.activeUser;const req=requestFor(p.id,data.activeUser);const isApproved=access(p,data.activeUser);const want=data.requests.filter(r=>r.postId===p.id).length;return `<article class="post"><div class="post-head"><div class="person"><span class="avatar">${esc(p.nickname?.slice(0,1)||'学')}</span><div><strong>${esc(p.nickname)}</strong><div class="muted small">${esc(p.grade)}・${esc(p.gender)}</div></div></div><span class="pill">${esc(p.kind)}</span></div><h3>${esc(p.job)}で働く私の自慢！</h3><div class="money">${esc(wages(p))}</div><div class="chips"><span class="chip">📍 ${esc(p.area)}</span><span class="chip">💼 ${esc(p.job)}</span><span class="chip">🔒 ${isApproved?'勤務先を開示済み':'勤務先は非公開'}</span></div>${p.benefits?.length?`<strong class="small">最高のメリット</strong><ul class="benefits">${p.benefits.filter(Boolean).map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`:'<p class="hint">メリットは未登録です。</p>'}${isApproved?`<div class="infobox"><strong>勤務先：${esc(p.workplace)}</strong>${own?'<div class="small muted">投稿者本人にのみ表示</div>':'<div class="small muted">あなたへの開示が承認されています。第三者への無断共有は控えてください。</div>'}${!own&&req?.shareInstagram&&req.instagram?`<p>Instagram：<a href="https://www.instagram.com/${encodeURIComponent(req.instagram.replace(/^@/,''))}/" target="_blank" rel="noopener noreferrer">@${esc(req.instagram.replace(/^@/,''))}</a>（投稿者が任意で共有）</p>`:''}</div>`:''}<div class="actions"><span class="small muted">♡ 知りたい ${want}人</span>${own?`<button class="btn light" data-action="inbox">リクエストを見る</button>`:req?`<button class="btn gray" disabled>${req.status==='pending'?'リクエスト送信済み':req.status==='approved'?'承認済み':'承認されませんでした'}</button>`:`<button class="btn" data-action="ask" data-id="${esc(p.id)}">勤務先を知りたい</button>`}</div></article>`};
function browse(){const areas=[...new Set([...areaOpts,...data.posts.map(p=>p.area)])];const posts=data.posts.filter(p=>(data.area==='all'||p.area===data.area)&&(data.kind==='all'||p.kind===data.kind)&&`${p.job} ${p.area} ${p.kind} ${p.benefits?.join(' ')}`.toLowerCase().includes(data.search.toLowerCase())).slice().reverse();return `<section class="hero"><div class="container"><div class="eyebrow">PROUD OF MY WORK</div><h1>そのバイト、ちょっと自慢させて。</h1><p>いい仕事は、知っている人だけが知っている。<br>気になる勤務先は、投稿者に「知りたい」を送ろう。</p><button class="btn" style="margin-top:22px" data-action="create">自分の仕事を自慢する →</button></div></section><div class="container layout"><section class="maincol"><div class="row spread" style="margin-bottom:16px"><h2 class="section-title" style="margin:0">みんなの自慢</h2><span class="small muted">${posts.length}件の投稿</span></div><div class="filter"><input id="search" class="control" placeholder="職種・メリットで検索" value="${esc(data.search)}"><select id="filterArea" class="control"><option value="all">すべてのエリア</option>${options(areas,data.area)}</select><select id="filterKind" class="control"><option value="all">すべての種類</option>${options(kindOpts,data.kind)}</select></div><div id="postList">${posts.length?posts.map(postCard).join(''):'<div class="empty">条件に合う投稿はありません。</div>'}</div></section><aside class="sidebar">${controls()}<div class="panel"><strong>勤務先を守る仕組み</strong><p class="hint">最初に見えるのはエリアまで。会社名・店舗名は投稿者に承認された人にだけ表示されます。</p><p class="hint">Instagramは承認時に、投稿者が希望した場合だけ共有できます。</p></div></aside></div>`}
function create(){return `<div class="container page"><div class="formpanel panel"><span class="eyebrow">SHARE YOUR WORK</span><h2>自慢したい仕事を投稿</h2><p class="hint">勤務先の詳細は公開されません。承認した相手にだけ伝わります。</p><div class="notice">デモはメール・SMS認証なしで操作できます。本番公開にはユーザー認証とサーバー側の開示権限チェックが必要です。</div><form id="createForm"><h3>あなたについて</h3><div class="two"><div class="field"><label>ニックネーム <span class="required">必須</span></label><input class="control" name="nickname" maxlength="24" required value="学生ユーザー"></div><div class="field"><label>性別 <span class="required">必須</span></label><select class="control" name="gender" required><option value="" selected disabled>選択してください</option>${options(['男性','女性','その他','回答しない'],'')}</select></div><div class="field"><label>学年 <span class="required">必須</span></label><select class="control" name="grade" required>${options(['大学1年','大学2年','大学3年','大学4年','大学5年以上','大学院生','その他'],'大学1年')}</select></div><div class="field"><label>仕事の種類 <span class="required">必須</span></label><select class="control" name="kind" required>${options(kindOpts,'アルバイト')}</select></div></div><h3>仕事について</h3><div class="two"><div class="field"><label>職種 <span class="required">必須</span></label><input name="job" class="control" type="text" required maxlength="60" placeholder="例：カフェスタッフ、個別指導講師"></div><div class="field"><label>公開エリア <span class="required">必須</span></label><select name="area" class="control" required>${options(areaOpts,'高田馬場・早稲田')}</select></div></div><div class="field"><label>勤務先名 <span class="required">必須</span> <span class="pill neutral">非公開</span></label><input name="workplace" class="control" required maxlength="120" placeholder="店舗名・企業名を入力"><div class="hint">承認されたユーザーにのみ表示。一般の投稿一覧や検索には出しません。</div></div><div class="field"><label>給与体系 <span class="required">必須</span></label><select id="payType" name="payType" class="control" required><option value="hour">時給制</option><option value="lesson">コマ制</option><option value="day">日給制</option><option value="commission">歩合制</option><option value="unpaid">無給インターン</option></select></div><div id="payFields"></div><h3>最高のメリット <span class="pill neutral">任意・最大10個</span></h3><p class="hint">あなたが自慢したいポイントを、書きたい数だけ。空欄のままでも投稿できます。</p>${Array.from({length:10},(_,i)=>`<div class="benefit-input"><span>${i+1}</span><input class="control" name="benefit${i}" maxlength="110" placeholder="${i===0?'例：シフトがとても自由':'メリットを入力（任意）'}"></div>`).join('')}<div class="notice">給与や勤務地といった組み合わせから、本人や勤務先が推測される場合があります。個人名・内部機密・第三者の個人情報は投稿しないでください。</div><button class="btn full" type="submit">自慢を公開する</button></form></div></div>`}
function payfields(){let p=el('payType')?.value;el('payFields').innerHTML=p==='unpaid'?'<div class="infobox">無給インターンとして掲載します。</div>':p==='commission'?`<div class="three"><div class="field"><label>最低報酬（円）<span class="required">必須</span></label><input class="control" type="number" min="0" step="10" name="min" required value="30000"></div><div class="field"><label>最高報酬（円）<span class="required">必須</span></label><input class="control" type="number" min="0" step="10" name="max" required value="120000"></div><div class="field"><label>金額の単位 <span class="required">必須</span></label><select class="control" name="unit">${[['month','月'],['week','週'],['day','日'],['case','件']].map(([a,b])=>`<option value="${a}">${b}あたり</option>`).join('')}</select></div></div><p class="hint">実績の幅を入力してください。最高額は必ずしも通常の収入を意味しません。</p>`:`<div class="two"><div class="field"><label>${p==='hour'?'時給':p==='lesson'?'1コマの報酬':'日給'}（円） <span class="required">必須</span></label><input class="control" name="pay" type="number" min="0" step="${p==='hour'?10:1}" required value="${p==='hour'?1500:p==='lesson'?3000:10000}"></div>${p==='hour'?'':`<div class="field"><label>${p==='lesson'?'1コマ':'1日'}の合計拘束時間（時間） <span class="required">必須</span></label><input class="control" name="hours" type="number" min="0.1" max="24" step="0.1" required value="${p==='lesson'?'1.5':'8'}"></div>`}</div>`}
function inbox(){const own=data.posts.filter(p=>p.owner===data.activeUser);const incoming=data.requests.filter(r=>own.some(p=>p.id===r.postId)).slice().reverse();return `<div class="container page"><h2 class="section-title">届いたリクエスト</h2><p class="hint">開示する相手はあなたが選べます。承認すると、その人だけに勤務先名が表示されます。</p><div style="max-width:760px">${controls()}${incoming.length?incoming.map(r=>{let p=data.posts.find(x=>x.id===r.postId);return `<div class="request"><div class="row spread"><span class="title">${esc(userName(r.requester))} さんから「知りたい」</span><span class="status ${r.status==='approved'?'yes':r.status==='rejected'?'no':''}">${r.status==='pending'?'未対応':r.status==='approved'?'承認済み':'拒否済み'}</span></div><div class="hint" style="margin:9px 0">対象：${esc(p?.job||'削除された投稿')} / ${esc(p?.area||'')}</div>${r.status==='pending'?`<div class="row"><button class="btn" data-action="approve" data-id="${esc(r.id)}">承認する</button><button class="btn outline" data-action="reject" data-id="${esc(r.id)}">拒否する</button></div>`:r.status==='approved'?`<div class="small muted">Instagram ${r.shareInstagram?'共有済み':'共有なし'}</div>`:''}</div>`}).join(''):'<div class="empty">まだリクエストはありません。閲覧者から送信するとここに表示されます。</div>'}</div></div>`}
function mine(){const own=data.posts.filter(p=>p.owner===data.activeUser).slice().reverse();const outgoing=data.requests.filter(r=>r.requester===data.activeUser).slice().reverse();const received=data.requests.filter(r=>own.some(p=>p.id===r.postId));return `<div class="container page"><h2 class="section-title">マイページ</h2><div style="max-width:780px">${controls()}<div class="panel"><strong>投稿の反響</strong><div class="metrics" style="margin-top:13px"><div class="metric"><strong>${own.length}</strong><span class="small muted">投稿数</span></div><div class="metric"><strong>${received.length}</strong><span class="small muted">知りたい数</span></div><div class="metric"><strong>${received.filter(r=>r.status==='approved').length}</strong><span class="small muted">承認数</span></div></div></div><h3>自分の投稿</h3>${own.length?own.map(postCard).join(''):'<div class="empty">まだ投稿がありません。あなたの仕事を自慢してみよう。</div>'}<h3>送ったリクエスト</h3>${outgoing.length?outgoing.map(r=>{let p=data.posts.find(x=>x.id===r.postId);return `<div class="request"><div class="row spread"><strong>${esc(p?.job||'削除された投稿')} / ${esc(p?.area||'')}</strong><span class="status ${r.status==='approved'?'yes':r.status==='rejected'?'no':''}">${r.status==='pending'?'返信待ち':r.status==='approved'?'承認済み':'拒否されました'}</span></div>${r.status==='approved'&&p?`<div class="infobox" style="margin-top:12px">勤務先：<strong>${esc(p.workplace)}</strong>${r.shareInstagram&&r.instagram?`<div>Instagram：<a href="https://www.instagram.com/${encodeURIComponent(r.instagram.replace(/^@/,''))}/" target="_blank" rel="noopener noreferrer">@${esc(r.instagram.replace(/^@/,''))}</a></div>`:''}</div>`:''}</div>`}).join(''):'<div class="empty">まだ送信したリクエストはありません。</div>'}</div></div>`}
function render(){el('app').innerHTML=data.screen==='create'?create():data.screen==='inbox'?inbox():data.screen==='mine'?mine():browse();document.querySelectorAll('[data-page]').forEach(b=>b.classList.toggle('active',b.dataset.page===data.screen));let unread=data.requests.filter(r=>r.status==='pending'&&data.posts.some(p=>p.id===r.postId&&p.owner===data.activeUser)).length;el('navCount').textContent=unread?`(${unread})`:'';if(data.screen==='create')payfields();if(data.screen==='browse')bindBrowse();const account=el('account');if(account)account.onchange=e=>{data.activeUser=e.target.value;save();render()};el('overlay').innerHTML=modal||''}
function bindBrowse(){el('search').oninput=e=>{data.search=e.target.value;save();el('postList').innerHTML=(data.posts.filter(p=>(data.area==='all'||p.area===data.area)&&(data.kind==='all'||p.kind===data.kind)&&`${p.job} ${p.area} ${p.kind} ${p.benefits?.join(' ')}`.toLowerCase().includes(data.search.toLowerCase())).slice().reverse().map(postCard).join(''))||'<div class="empty">条件に合う投稿はありません。</div>'};el('filterArea').onchange=e=>{data.area=e.target.value;save();render()};el('filterKind').onchange=e=>{data.kind=e.target.value;save();render()}}
function showModal(inner){modal=`<div class="modalback" role="presentation" data-action="dismiss"><div class="modal" role="dialog" aria-modal="true" aria-label="確認画面">${inner}</div></div>`;el('overlay').innerHTML=modal}
function closeModal(){modal=null;el('overlay').innerHTML=''}
function ask(id){let p=data.posts.find(x=>x.id===id);if(!p||p.owner===data.activeUser||requestFor(id,data.activeUser))return;showModal(`<h2>勤務先を知りたい</h2><p>「${esc(p.job)} / ${esc(p.area)}」の投稿者に開示リクエストを送ります。</p><div class="infobox">承認された場合だけ勤務先名が表示されます。Instagramの共有は投稿者の任意です。<br>同じ投稿へのリクエストは1回だけです。</div><div class="foot"><button class="btn gray" data-action="dismiss">キャンセル</button><button class="btn" data-action="confirmAsk" data-id="${esc(id)}">リクエストを送る</button></div>`)}
function approve(id){const r=data.requests.find(x=>x.id===id);if(!r||r.status!=='pending'||!data.posts.some(p=>p.id===r.postId&&p.owner===data.activeUser))return;showModal(`<h2>勤務先を開示しますか？</h2><p>承認すると、この閲覧者にだけ勤務先名が表示されます。</p><div class="field"><label><input type="checkbox" id="shareIg"> Instagramも任意で共有する</label></div><div id="instaField" class="field hide"><label>Instagramユーザーネーム（@なし）</label><input id="instaId" class="control" placeholder="例：my_work_life" maxlength="30" pattern="[A-Za-z0-9._]+"><span class="hint">Instagramを共有しなくても勤務先は承認できます。</span></div><div class="foot"><button class="btn gray" data-action="dismiss">キャンセル</button><button class="btn" data-action="confirmApprove" data-id="${esc(id)}">承認する</button></div>`);el('shareIg').onchange=e=>el('instaField').classList.toggle('hide',!e.target.checked)}
function reject(id){const r=data.requests.find(x=>x.id===id);if(!r||r.status!=='pending'||!data.posts.some(p=>p.id===r.postId&&p.owner===data.activeUser))return;showModal(`<h2>リクエストを拒否しますか？</h2><p>拒否した閲覧者には勤務先を開示しません。</p><div class="foot"><button class="btn gray" data-action="dismiss">キャンセル</button><button class="btn outline" data-action="confirmReject" data-id="${esc(id)}">拒否する</button></div>`)}
document.addEventListener('click',e=>{const b=e.target.closest('[data-page],[data-action]');if(!b)return;if(b.dataset.page){nav(b.dataset.page);return}const a=b.dataset.action,id=b.dataset.id;if(a==='dismiss'){if(e.target.closest('.modal')&&!e.target.closest('button'))return;closeModal();return}if(a==='create'||a==='inbox'){nav(a);return}if(a==='ask')return ask(id);if(a==='approve')return approve(id);if(a==='reject')return reject(id);if(a==='confirmAsk'){if(requestFor(id,data.activeUser)||!data.posts.find(p=>p.id===id&&p.owner!==data.activeUser))return;data.requests.push({id:'r'+Date.now()+Math.random().toString(36).slice(2,6),postId:id,requester:data.activeUser,status:'pending',shareInstagram:false,instagram:'',created:new Date().toISOString()});save();closeModal();render();return}if(a==='confirmApprove'){const r=data.requests.find(x=>x.id===id);if(!r||r.status!=='pending'||!data.posts.some(p=>p.id===r.postId&&p.owner===data.activeUser))return;const share=el('shareIg').checked;const ig=el('instaId')?.value.trim().replace(/^@/,'')||'';if(share&&!/^[A-Za-z0-9._]{1,30}$/.test(ig)){alert('Instagramのユーザーネームを入力してください。');return}Object.assign(r,{status:'approved',shareInstagram:share,instagram:share?ig:'',decided:new Date().toISOString()});save();closeModal();render();return}if(a==='confirmReject'){const r=data.requests.find(x=>x.id===id);if(!r||r.status!=='pending'||!data.posts.some(p=>p.id===r.postId&&p.owner===data.activeUser))return;r.status='rejected';r.decided=new Date().toISOString();save();closeModal();render()}});
document.addEventListener('change',e=>{if(e.target.id==='payType')payfields()});
document.addEventListener('submit',e=>{if(e.target.id!=='createForm')return;e.preventDefault();const f=new FormData(e.target),kind=f.get('payType');const amt=Number(f.get('pay')||0),mi=Number(f.get('min')||0),ma=Number(f.get('max')||0);if(kind==='commission'&&ma<mi){alert('最高報酬は最低報酬以上にしてください。');return}if(kind!=='commission'&&kind!=='unpaid'&&amt<=0){alert('給与金額を入力してください。');return}const post={id:'p'+Date.now(),owner:data.activeUser==='viewer'?'new:'+Date.now():data.activeUser,nickname:f.get('nickname').trim(),gender:f.get('gender'),grade:f.get('grade'),kind:f.get('kind'),job:f.get('job'),area:f.get('area'),workplace:f.get('workplace').trim(),payType:kind,pay:amt,hours:Number(f.get('hours')||0),min:mi,max:ma,unit:f.get('unit')||'month',benefits:Array.from({length:10},(_,i)=>(f.get('benefit'+i)||'').trim()).filter(Boolean),created:new Date().toISOString()};if(!post.nickname||!post.gender||!post.job||!post.workplace){alert('必須項目を入力してください。');return}data.posts.push(post);data.activeUser=post.owner;data.screen='mine';save();render();scrollTo(0,0);alert('投稿を公開しました。デモでは、このブラウザ内に保存されます。')});
render();
</script></body></html>
